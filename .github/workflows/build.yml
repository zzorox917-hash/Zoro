name: Build ZORO APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ZORO_Project_fixed.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4
      - run: cd ZOROSoundboard && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZORO-apk
          path: ZOROSoundboard/app/build/outputs/apk/debug/app-debug.apk
